frame_source:
  mode: url
  url: "${PERSON_PRESENCE_API_BASE_URL}/v1/camera-ingest/latest-frame/image"
  interval_sec: 10
  timeout_sec: 12
  headers:
    Authorization: "Bearer ${PERSON_PRESENCE_DEVICE_TOKEN}"

platform:
  enabled: false
  api_base_url: "${PERSON_PRESENCE_API_BASE_URL}"
  device_token: "${PERSON_PRESENCE_DEVICE_TOKEN}"
  timeout_sec: 10
  retry_queue_size: 20

detector:
  backend: paddledet
  detector_name: paddledet_ppyoloe_plus_person
  model_dir: "/opt/fourwall/person-presence/models/ppyoloe_plus_crn_l_80e_coco"
  device: gpu
  run_mode: paddle
  confidence_threshold: 0.55
  min_bbox_height_px: 48
  # Optional image-space polygon, in [u, v] pixel coordinates. Empty means full image.
  valid_region_polygon: []
  constructor_options: {}

# ---------------------------------------------------------------------------
# YOLOX backend (cv2.dnn ONNX) — accurate CNN detector, no torch/paddle needed.
# Runs on opencv-python-headless (cv2.dnn) + numpy only. Much fewer false
# positives than the HOG backend. See README "YOLOX backend 部署" for the exact
# model download URL.
#
# detector:
#   backend: yolox
#   detector_name: yolox_s_opencv_zoo
#   # model_dir is used as the full path to the .onnx file (or set
#   # constructor_options.model_path instead — model_path wins if both are set).
#   model_dir: "/opt/fourwall/person-presence/models/object_detection_yolox_2022nov.onnx"
#   device: gpu            # gpu -> tries cv2.dnn CUDA backend, falls back to CPU
#   confidence_threshold: 0.4   # score = obj * cls_person; 0.4 is a good start
#   min_bbox_height_px: 48
#   valid_region_polygon: []
#   constructor_options:
#     # model_path: "/abs/path/to/model.onnx"   # optional; overrides model_dir
#     nms_threshold: 0.45     # IoU threshold for cv2.dnn.NMSBoxes
#     strides: [8, 16, 32]    # YOLOX FPN strides; leave as-is for stock models
#     input_size: 640         # YOLOX letterbox size (square)
#     # decoded: false        # set true ONLY if your ONNX already bakes the
#     #                        # grid+stride decode in (avoids double-decoding).
#     #                        # The stock OpenCV Zoo model is RAW -> keep false.

projection:
  calibration_id: null
  # Optional 3x3 homography from image foot point [u, v, 1] to Factory Twin {x, z}.
  # homography:
  #   - [0.01, 0.0, -6.0]
  #   - [0.0, 0.01, -12.0]
  #   - [0.0, 0.0, 1.0]

debug:
  runtime_dir: runtime
  save_debug_frames: false
  rolling_keep: 100
