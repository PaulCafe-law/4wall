frame_source:
  mode: "url" # file | url
  path: "samples/hc600.jpg"
  url: "https://four-wall-api.onrender.com/v1/camera-ingest/latest-frame/image"
  interval_sec: 30
  timeout_sec: 12
  headers:
    Authorization: "Bearer ${HMI_OCR_DEVICE_TOKEN}"

platform:
  enabled: true
  api_base_url: "https://four-wall-api.onrender.com"
  device_token: "REPLACE_WITH_CAMERA_DEVICE_TOKEN"
  timeout_sec: 10
  submit_gauge_readings: true
  submit_ocr_observations: true

ocr:
  engine: "paddle"
  lang: "chinese_cht"
  ocr_version: "PP-OCRv5"
  device: "gpu:0"
  min_confidence: 0.55
  constructor_options: {}

# Frame size [width, height] the pixel ROIs below were measured at. When the
# camera stream outputs a different size (e.g. the 192.168.1.10 main stream
# switching 2560x1440 -> 2880x1620), every pixel ROI is scaled proportionally
# at runtime. Omit only for legacy configs whose ROIs must be applied unscaled.
reference_resolution: [2560, 1440]

hmi:
  camera_label: "PoE Camera 192.168.1.10"
  detector_name: "paddleocr_ppocrv5_hmi"
  # Coordinates measured from 2560x1440 PoE Camera 192.168.1.10 frames on 2026-07-04.
  # x,y,w,h in pixels at reference_resolution; [0,0,0,0] means whole frame.
  # Values may instead all be fractions (0..1) of the actual frame size.
  roi: [925, 550, 450, 325]
  fields: []

work_order:
  enabled: true
  # Same coordinate rules as hmi.roi; ruler currently occludes part of this region.
  roi: [900, 120, 550, 335]

gpt:
  enabled: true
  auth_mode: "account_oauth_dev"
  summary_model: "latest"
  auth_cache_dir: "" # optional: local nckusoc-only account auth cache directory
  # Command bridge for nckusoc's locally logged-in Codex/OpenAI OAuth account.
  # It receives JSON on stdin and prints JSON on stdout.
  command:
    - "./.venv/bin/python"
    - "scripts/codex_summary_bridge.py"
    - "--model"
    - "{model}"
    - "--timeout-sec"
    - "120"
  timeout_sec: 150
  min_interval_sec: 300

debug:
  runtime_dir: "runtime"
  save_crops: true
  rolling_keep: 200
