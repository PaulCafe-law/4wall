# Desired-state blueprint for Git-backed service recreation.
# The live services are image-backed, so the Render dashboard is authoritative:
# deploy one immutable image with account linking disabled, run the API pre-deploy
# migration and smoke checks, then manually promote/enable the feature.
services:
  - type: web
    name: four-wall-api-staging
    runtime: docker
    rootDir: planner-server
    preDeployCommand: python scripts/render_predeploy.py
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: BUILDING_ROUTE_ENVIRONMENT
        value: staging
      - key: BUILDING_ROUTE_APP_ORIGIN
        sync: false
      - key: BUILDING_ROUTE_DATABASE_URL
        sync: false
      - key: BUILDING_ROUTE_AUTH_SECRET_KEY
        sync: false
      - key: BUILDING_ROUTE_ROUTE_PROVIDER
        value: osrm
      - key: BUILDING_ROUTE_ARTIFACT_BACKEND
        value: s3
      - key: BUILDING_ROUTE_S3_BUCKET
        sync: false
      - key: BUILDING_ROUTE_S3_ENDPOINT_URL
        sync: false
      - key: BUILDING_ROUTE_S3_REGION
        sync: false
      - key: BUILDING_ROUTE_S3_ACCESS_KEY_ID
        sync: false
      - key: BUILDING_ROUTE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: BUILDING_ROUTE_BOOTSTRAP_OPERATOR_ENABLED
        value: "false"
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_WEBHOOK_ENABLED
        value: "false"
      - key: LINE_DEFAULT_GROUP_ID
        sync: false
      - key: LINE_INCIDENT_NOTIFY_ENABLED
        value: "false"
      - key: LINE_PUBLIC_BASE_URL
        sync: false
      - key: LINE_ACCOUNT_LINKING_ENABLED
        value: "false"
      - key: LINE_ACCOUNT_LINK_ENCRYPTION_KEYS
        sync: false
      - key: LINE_DESTINATION_ID
        sync: false
      - key: CODEX_CLI_PATH
        sync: false
      - key: CODEX_TEXT_MODEL
        value: gpt-5.5
      - key: CODEX_TEXT_TIMEOUT_SECONDS
        value: "600"
      - key: CODEX_HOME
        sync: false
      - key: WORLDLABS_API_KEY
        sync: false
      - key: WORLDLABS_MODEL
        value: marble-1.1-plus
      - key: WORLDLABS_OPERATION_TIMEOUT_SECONDS
        value: "3600"
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_QWEN_VLM_MODEL
        value: qwen2.5vl:7b
      - key: OLLAMA_REQUEST_TIMEOUT_SECONDS
        value: "120"
      - key: STORAGE_PROVIDER
        value: s3
      - key: BOXER_REPO_PATH
        sync: false
      - key: BOXER_CHECKPOINT_PATH
        sync: false
      - key: BOXER_ANNOTATION_COMMAND
        sync: false
      - key: GSPLAT_PYTHON_ENV
        sync: false
      - key: GSPLAT_RENDER_COMMAND
        sync: false
      - key: ENABLE_EGO_PLANNER
        value: "false"
      - key: EGO_PLANNER_ROS_WORKSPACE
        sync: false
      - key: EGO_PLANNER_COMMAND
        sync: false

