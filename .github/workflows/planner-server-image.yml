name: Planner Server Image Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional immutable Docker Hub tag. Defaults to the short commit SHA.
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - "planner-server/**"
      - "shared-schemas/**"
      - "render.yaml"
      - ".github/workflows/planner-server-image.yml"

permissions:
  contents: read

concurrency:
  group: production-api-image-deploy
  cancel-in-progress: false

env:
  API_BASE_URL: https://four-wall-api.onrender.com
  DOCKERHUB_IMAGE: docker.io/paul953206/4wall-api
  RENDER_SERVICE_ID: srv-d7chueu7r5hc73esq5pg

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Check required secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          missing=()
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN RENDER_API_KEY; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build and push production API image
        env:
          INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag || '' }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          image_tag="${INPUT_IMAGE_TAG:-$short_sha}"
          docker build \
            -t "$DOCKERHUB_IMAGE:$image_tag" \
            -t "$DOCKERHUB_IMAGE:prod" \
            planner-server
          docker push "$DOCKERHUB_IMAGE:$image_tag"
          docker push "$DOCKERHUB_IMAGE:prod"
          {
            echo "image_tag=$image_tag"
            echo "image=$DOCKERHUB_IMAGE:$image_tag"
            echo "prod_image=$DOCKERHUB_IMAGE:prod"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Production API image"
            echo ""
            echo "- Immutable: \`$DOCKERHUB_IMAGE:$image_tag\`"
            echo "- Moving tag: \`$DOCKERHUB_IMAGE:prod\`"
          } >> "$GITHUB_STEP_SUMMARY"
        id: image

      - name: Trigger Render production API deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          response="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")"
          deploy_id="$(printf '%s' "$response" | python -c 'import json,sys; data=json.load(sys.stdin); print(data.get("id") or data.get("deploy", {}).get("id") or "unknown")')"
          if [ "$deploy_id" = "unknown" ]; then
            echo "Render deploy response did not include an id."
            exit 1
          fi
          echo "Render deploy started: $deploy_id"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "- Render deploy: \`$deploy_id\`" >> "$GITHUB_STEP_SUMMARY"
        id: render

      - name: Wait for Render deploy to finish
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DEPLOY_ID: ${{ steps.render.outputs.deploy_id }}
        run: |
          for attempt in $(seq 1 90); do
            response="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$RENDER_DEPLOY_ID")"
            status="$(printf '%s' "$response" | python -c 'import json,sys; data=json.load(sys.stdin); print(data.get("status") or data.get("deploy", {}).get("status") or "unknown")')"
            echo "Render deploy status attempt $attempt: $status"
            case "$status" in
              live|succeeded|deployed)
                exit 0
                ;;
              failed|canceled|cancelled)
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Render deploy did not finish in time."
          exit 1

      - name: Wait for production health
        run: |
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error "$API_BASE_URL/healthz"; then
              echo "Production API health check passed on attempt $attempt."
              exit 0
            fi
            sleep 10
          done
          echo "Production API health check did not pass after deploy."
          exit 1
